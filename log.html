<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="Acede às tuas notas no NotaBook.">
    <title>Acesso — NotaBook</title>
    <link rel="stylesheet" href="components/auth/login.css">
</head>
<body class="auth-page">
    <div class="ambient-light" aria-hidden="true">
        <span class="ambient-blob ambient-blob--blue"></span>
        <span class="ambient-blob ambient-blob--violet"></span>
        <span class="ambient-blob ambient-blob--green"></span>
    </div>

    <div class="auth-loader" id="auth-loader" aria-live="polite">
        <div class="loader-spinner" aria-hidden="true"></div>
        <p>A verificar a tua conta…</p>
    </div>

    <main class="auth-shell">
        <section class="auth-card" id="login-view" aria-labelledby="form-title">
            <div class="brand-mark" aria-hidden="true">N</div>
            <p class="eyebrow">Área privada</p>
            <h1 id="form-title">Acede ao NotaBook</h1>
            <p class="intro" id="form-intro">Entra para continuares a organizar as tuas notas.</p>

            <form id="auth-form" novalidate>
                <div class="field field--optional" id="name-field" hidden>
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" autocomplete="name" placeholder="O teu nome">
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="nome@exemplo.pt" required>
                </div>

                <div class="field">
                    <label for="password">Palavra-passe</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="A tua palavra-passe" minlength="6" required>
                        <button class="password-toggle" id="toggle-password" type="button" aria-label="Mostrar palavra-passe">Mostrar</button>
                    </div>
                </div>

                <p class="form-message" id="form-message" role="alert" hidden></p>
                <button class="primary-button" id="submit-button" type="submit">Entrar</button>
            </form>

            <p class="switch-mode" id="switch-mode">
                Ainda não tens conta?
                <button type="button" id="switch-button">Criar conta</button>
            </p>
            <p class="security-note"><span aria-hidden="true">●</span> A tua sessão é protegida pelo Firebase.</p>
        </section>

        <section class="auth-card pending-card" id="pending-view" aria-labelledby="pending-title" hidden>
            <div class="status-icon" aria-hidden="true">⌛</div>
            <p class="eyebrow">Quase lá</p>
            <h1 id="pending-title">Acesso pendente</h1>
            <p class="intro">A tua conta foi criada e está a aguardar a aprovação da nossa equipa.</p>
            <button class="secondary-button" id="logout-button" type="button">Sair / Voltar</button>
        </section>
    </main>

    <script type="module" src="components/auth/login.js"></script>
</body>
</html>
