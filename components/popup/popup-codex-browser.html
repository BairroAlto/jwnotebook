<div id="popup-codex-browser-overlay" class="popup-overlay" style="z-index: 10150;">
    <div class="popup-content codex-browser-shell">
        <div class="codex-browser-header">
            <div class="codex-browser-heading">
                <span class="codex-browser-heading-icon"><i class="fa-solid fa-book-journal-whills"></i></span>
                <div>
                    <h3>Explorador Codex</h3>
                    <p>Escolhe a fonte que queres associar</p>
                </div>
            </div>
            <button id="btn-fechar-codex-browser" type="button" aria-label="Fechar Explorador Codex"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="codex-browser-breadcrumb">
            <i class="fa-solid fa-location-dot"></i>
            <span id="codex-navegacao-caminho">Repositório &gt; Selecionar Categoria</span>
        </div>

        <div id="codex-browser-lista" class="codex-browser-lista">
            <!-- Navegação injetada via JS (Categorias > Anos > Ficheiros > Artigos > Parágrafos) -->
        </div>

        <div class="codex-browser-footer">
            <div class="codex-selection-status">
                <i class="fa-solid fa-layer-group"></i>
                <span id="codex-selecionados-info">0 itens seleccionados</span>
            </div>
            <button id="btn-confirmar-codex" class="btn-primary" type="button">
                <i class="fa-solid fa-check"></i> Confirmar selecção
            </button>
        </div>
    </div>
</div>
