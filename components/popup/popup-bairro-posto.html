<div id="popup-bairro-posto-overlay" class="popup-overlay" style="z-index: 10040;">
    <div class="popup-content bairro-posto-content">
        <div class="popup-header">
            <h3>Posto de Ligação</h3>
            <button type="button" id="btn-fechar-bairro-posto" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="bairro-posto-tabs">
            <button type="button" data-bairro-posto-tab="casa"><i class="fa-solid fa-house"></i> Esta Casa</button>
            <button type="button" data-bairro-posto-tab="bairro"><i class="fa-solid fa-city"></i> Este bairro</button>
        </div>
        <div class="bairro-posto-body">
            <section data-bairro-posto-panel="casa">
                <div class="bairro-posto-casa-tabs" role="tablist" aria-label="Conteúdo da casa">
                    <button type="button" data-bairro-casa-tab="geral" role="tab">Geral</button>
                    <button type="button" data-bairro-casa-tab="actas" role="tab">Actas</button>
                    <button type="button" data-bairro-casa-tab="historico-actas" role="tab" hidden>Histórico de Actas</button>
                </div>
                <div class="bairro-posto-casa-panel" data-bairro-casa-panel="geral" role="tabpanel">
                    <label class="bairro-posto-label bairro-posto-label--icon" for="bairro-posto-titulo"><i class="fa-solid fa-briefcase" aria-hidden="true"></i><span>Título da tarefa</span></label>
                    <input id="bairro-posto-titulo" class="bairro-posto-input" type="text" placeholder="Nova tarefa...">
                    <div class="bairro-posto-separator"></div>
                    <p class="bairro-posto-label bairro-posto-label--icon"><i class="fa-solid fa-clipboard-check" aria-hidden="true"></i><span>Tipo de check</span></p>
                    <div id="bairro-posto-checks" class="bairro-posto-checks"></div>
                    <div class="bairro-posto-separator"></div>
                    <div class="bairro-posto-associar-head">
                        <p class="bairro-posto-label bairro-posto-label--icon"><i class="fa-solid fa-link" aria-hidden="true"></i><span>Ligação</span></p>
                    </div>
                    <div class="bairro-posto-ligacao-pesquisa" hidden>
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input id="bairro-posto-pesquisa-ligacao" type="search" placeholder="Pesquisar conteúdos..." autocomplete="off">
                    </div>
                    <div id="bairro-posto-explorador" class="bairro-posto-explorador" hidden>
                        <div id="bairro-arvore-associar-content"></div>
                    </div>
                    <div id="bairro-posto-ligacao-atual" class="bairro-posto-ligacao-atual"></div>
                </div>
                <div class="bairro-posto-casa-panel" data-bairro-casa-panel="actas" role="tabpanel" hidden>
                    <div class="bairro-posto-actas-cabecalho bairro-posto-actas-cabecalho--acoes">
                        <button type="button" id="btn-bairro-acta-add" class="bairro-posto-acta-add" title="Nova acta" aria-label="Nova acta"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
                    </div>
                    <div id="bairro-posto-actas-lista" class="bairro-posto-actas-lista"></div>
                </div>
                <div class="bairro-posto-casa-panel" data-bairro-casa-panel="historico-actas" role="tabpanel" hidden>
                    <div id="bairro-posto-historico-actas-lista" class="bairro-posto-actas-lista"></div>
                </div>
            </section>
            <section data-bairro-posto-panel="bairro" hidden>
                <div class="bairro-posto-bairro-header">
                    <span class="bairro-posto-label">Este bairro</span>
                    <button type="button" id="bairro-posto-remover-bairro" class="bairro-posto-remover-bairro">
                        <i class="fa-solid fa-eye-slash" aria-hidden="true"></i>
                        <span>Remover Bairro</span>
                    </button>
                </div>
                <div class="bairro-posto-secao bairro-posto-secao--toggle">
                    <label class="bairro-posto-toggle">
                        <input id="bairro-posto-ocultar-checados" type="checkbox">
                        <span class="bairro-posto-toggle-track" aria-hidden="true"></span>
                        <span>Ocultar já checados</span>
                    </label>
                </div>
                <div class="bairro-posto-secao bairro-posto-secao--direcao">
                    <p class="bairro-posto-label">Direção de criação</p>
                    <p class="bairro-posto-hint">Escolhe onde as novas tarefas são criadas ao clicar em +.</p>
                    <div id="bairro-posto-direcao-options" class="bairro-posto-checks" style="grid-template-columns: repeat(2, minmax(0,1fr));">
                        <button type="button" class="bairro-posto-check-opcao" data-bairro-direcao="cima">
                            <span class="bairro-posto-check-icone"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></span>
                            <span><strong>Para cima</strong><small>Inserir no topo</small></span>
                        </button>
                        <button type="button" class="bairro-posto-check-opcao" data-bairro-direcao="baixo">
                            <span class="bairro-posto-check-icone"><i class="fa-solid fa-arrow-down" aria-hidden="true"></i></span>
                            <span><strong>Para baixo</strong><small>Inserir no fim</small></span>
                        </button>
                    </div>
                </div>
                <div class="bairro-posto-secao bairro-posto-secao--checks">
                    <p class="bairro-posto-hint">Escolhe o check predefinido para todos os Filhos deste Pai.</p>
                    <div id="bairro-posto-checks-pai" class="bairro-posto-checks"></div>
                </div>
                <section class="bairro-posto-secao bairro-posto-historico">
                    <button type="button" id="btn-bairro-posto-historico" class="bairro-posto-historico-toggle" aria-expanded="false">
                        <span>Histórico</span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </button>
                    <div id="bairro-posto-historico-lista" hidden></div>
                </section>
            </section>
        </div>
    </div>
</div>
