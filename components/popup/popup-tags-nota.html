<!-- components/popup/popup-tags-nota.html -->
<div id="popup-tags-nota-overlay" class="popup-overlay" style="z-index: 10005;">
    <div class="popup-content" style="max-width: 450px; width: 95%;">
        <div class="popup-header">
            <h3>Tópicos da Nota</h3>
            <button id="btn-fechar-tags-nota"><i class="fa-solid fa-xmark"></i></button>
        </div>


        <div id="arranque-nota-toggle-wrap" hidden style="margin: 0 20px; padding: 12px; border: 1px solid rgba(251, 146, 60, 0.24); border-radius: 8px; background: rgba(251, 146, 60, 0.05);">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px;">
                <div>
                    <label style="display:block; color:#fed7aa; font-size:12px; font-weight:700;">Arrancar a plataforma com esta nota</label>
                    <span style="display:block; margin-top:4px; color:var(--text-muted); font-size:10px;">Usa a nota atual como página de arranque neste dispositivo.</span>
                </div>
                <label class="switch-container">
                    <input type="checkbox" id="check-arranque-nota">
                    <span class="switch-slider"></span>
                </label>
            </div>
        </div>

        <div style="padding: 20px; min-height: 300px; max-height: 70vh; overflow-y: auto; background-color: var(--bg-body);">
            
            <div id="lista-vinc-topicos-nota" class="pill-container" style="margin-bottom: 20px;"></div>

            <div style="height: 1px; background: var(--border-color); margin: 20px 0;"></div>

            <div id="area-form-topicos-nota">
                <label style="display:block; font-size:10px; color:var(--primary); margin-bottom:8px; text-transform:uppercase; font-weight: 700;">Vincular Novo Tópico</label>
                
                <!-- PESQUISA PAI -->
                <div style="margin-bottom: 15px;">
                    <div style="position: relative;">
                        <input type="text" id="search-tags-nota-topico" placeholder="1. Escolher Tópico Pai..." style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid var(--border-color); border-radius: 4px; color: white; outline: none;">
                        <!-- ADICIONADO: CONTENTOR DE RESULTADOS PAI -->
                        <div id="results-tags-nota-topico" class="tags-search-results" style="display: none;"></div>
                    </div>
                    <div id="selected-tags-nota-topico-display" style="margin-top:10px;"></div>
                </div>

                <!-- PESQUISA SUBTÓPICO -->
                <div id="section-tags-nota-subtopico" style="opacity: 0.3; pointer-events: none; transition: 0.3s;">
                    <div style="position: relative;">
                        <input type="text" id="search-tags-nota-subtopico" placeholder="2. Escolher Subtópico..." style="width: 100%; padding: 12px; background: #1e293b; border: 1px solid var(--border-color); border-radius: 4px; color: white; outline: none;">
                        <!-- ADICIONADO: CONTENTOR DE RESULTADOS SUBTÓPICO -->
                        <div id="results-tags-nota-subtopico" class="tags-search-results" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="popup-confirmar-arranque-overlay" class="popup-overlay" style="z-index: 10020;">
        <div class="popup-content" style="max-width: 340px; width: 92%; padding: 24px; text-align: center;">
            <div style="color:#fb923c; font-size:32px; margin-bottom:12px;">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h3 style="color:var(--text-main); font-size:16px; margin-bottom:10px;">Substituir página de arranque?</h3>
            <p id="msg-confirmar-arranque" style="color:var(--text-muted); font-size:13px; line-height:1.5; margin-bottom:22px;"></p>
            <div style="display:flex; gap:10px;">
                <button id="btn-cancelar-arranque" type="button" style="flex:1; padding:10px; background:transparent; border:1px solid var(--border-color); color:var(--text-main); border-radius:6px; cursor:pointer;">Não</button>
                <button id="btn-confirmar-arranque" type="button" style="flex:1; padding:10px; background:#fb923c; border:none; color:#111827; border-radius:6px; cursor:pointer; font-weight:700;">Sim</button>
            </div>
        </div>
    </div>
</div>
