<div id="popup-gmail-overlay" class="popup-overlay" style="z-index:10030;">
    <div class="popup-content gmail-config" role="dialog" aria-modal="true" aria-labelledby="gmail-config-titulo">
        <div class="gmail-config__cabecalho">
            <div>
                <span class="gmail-config__sobrelinha">Ferramenta da Loja</span>
                <h3 id="gmail-config-titulo">CONFIGURAR GMAIL</h3>
            </div>
            <i class="fa-solid fa-envelope"></i>
        </div>
        <p class="gmail-config__descricao">Liga a tua conta Google e escolhe os emails que queres consultar nesta ferramenta.</p>

        <section class="gmail-config__conta">
            <span class="gmail-config__conta-icone"><i class="fa-brands fa-google"></i></span>
            <div>
                <strong id="gmail-config-conta">Nenhuma conta ligada</strong>
                <small id="gmail-config-estado" data-tipo="desligado">O conteúdo dos emails não é guardado na nota.</small>
            </div>
            <button id="btn-ligar-gmail" type="button">Ligar</button>
            <button id="btn-desligar-gmail" type="button" hidden>Desligar</button>
        </section>

        <div class="gmail-config__campos">
            <label>
                <span>Emails a mostrar</span>
                <select id="gmail-limite">
                    <option value="10">10 emails</option>
                    <option value="25">25 emails</option>
                    <option value="50">50 emails</option>
                </select>
            </label>
            <label>
                <span>Filtro</span>
                <select id="gmail-filtro">
                    <option value="todos">Todos os recentes</option>
                    <option value="nao_lidos">Apenas não lidos</option>
                    <option value="anexos">Com anexos</option>
                </select>
            </label>
        </div>

        <div class="gmail-config__privacidade">
            <i class="fa-solid fa-shield-halved"></i>
            <p><strong>Somente leitura.</strong> O NotaBook mostra remetente, assunto e excerto. Não envia, altera nem apaga emails.</p>
        </div>

        <div class="gmail-config__botoes">
            <button id="btn-cancelar-gmail" type="button">Cancelar</button>
            <button id="btn-confirmar-gmail" type="button">Aplicar</button>
        </div>
    </div>
</div>
