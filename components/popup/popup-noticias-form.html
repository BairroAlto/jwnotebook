<div id="popup-noticias-overlay" class="popup-overlay" style="z-index:10030;">
    <div class="popup-content popup-configuracao popup-configuracao--noticias" style="max-width:420px; padding:25px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;">
            <h3 style="margin:0; color:#a56a43; font-size:16px; font-weight:800;">CONFIGURAR NOTÍCIAS</h3>
            <button id="btn-atualizar-noticias-popup" type="button" title="Atualizar notícias" aria-label="Atualizar notícias" style="display:flex; align-items:center; justify-content:center; width:32px; height:32px; border:1px solid rgba(214,164,127,.35); border-radius:8px; background:rgba(91,56,36,.22); color:#d6a47f; cursor:pointer;">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
        <label style="display:block; margin-bottom:14px;">
            <span style="display:block; margin-bottom:7px; color:var(--text-muted); font-size:10px; font-weight:800; text-transform:uppercase;">Temas</span>
            <textarea id="noticias-temas" rows="5" placeholder="Inteligência Artificial&#10;Portugal&#10;Cinema" style="width:100%; padding:11px; resize:vertical; background:var(--bg-body); border:1px solid var(--border-color); color:var(--text-main); border-radius:8px; font:inherit;"></textarea>
        </label>

        <label style="display:block; margin-bottom:14px;">
            <span style="display:block; margin-bottom:7px; color:var(--text-muted); font-size:10px; font-weight:800; text-transform:uppercase;">Excluir palavras</span>
            <input id="noticias-excluir" type="text" placeholder="rumor, publicidade" style="width:100%; padding:11px; background:var(--bg-body); border:1px solid var(--border-color); color:var(--text-main); border-radius:8px;">
        </label>

        <label style="display:block;">
            <span style="display:block; margin-bottom:7px; color:var(--text-muted); font-size:10px; font-weight:800; text-transform:uppercase;">País e idioma</span>
            <select id="noticias-mercado" style="width:100%; padding:11px; background:var(--bg-body); border:1px solid var(--border-color); color:var(--text-main); border-radius:8px;">
                <option value="PT">Portugal · Português</option>
                <option value="BR">Brasil · Português</option>
                <option value="US">Estados Unidos · Inglês</option>
                <option value="GB">Reino Unido · Inglês</option>
                <option value="ES">Espanha · Espanhol</option>
            </select>
        </label>

        <label style="display:block; margin-top:14px; margin-bottom:14px;">
            <span style="display:block; margin-bottom:7px; color:var(--text-muted); font-size:10px; font-weight:800; text-transform:uppercase;">Quantidade de notícias por tema</span>
            <select id="noticias-limite-tema" style="width:100%; padding:11px; background:var(--bg-body); border:1px solid var(--border-color); color:var(--text-main); border-radius:8px;">
                <option value="1">1 notícia</option>
                <option value="2">2 notícias</option>
                <option value="3">3 notícias</option>
                <option value="4">4 notícias</option>
                <option value="5">5 notícias</option>
                <option value="6">6 notícias</option>
                <option value="7">7 notícias</option>
                <option value="8">8 notícias</option>
                <option value="9">9 notícias</option>
                <option value="10">10 notícias</option>
            </select>
        </label>

        <label style="display:block;">
            <span style="display:block; margin-bottom:7px; color:var(--text-muted); font-size:10px; font-weight:800; text-transform:uppercase;">Vista</span>
            <select id="noticias-vista" style="width:100%; padding:11px; background:var(--bg-body); border:1px solid var(--border-color); color:var(--text-main); border-radius:8px;">
                <option value="lista">Lista</option>
                <option value="grelha">Grelha</option>
            </select>
        </label>

        <p id="noticias-config-erro" hidden style="margin:12px 0 0; color:#fca5a5; font-size:11px;"></p>

        <div style="display:flex; gap:10px; margin-top:22px;">
            <button id="btn-cancelar-noticias" type="button" style="flex:1; padding:12px; background:transparent; border:1px solid var(--border-color); color:var(--text-muted); border-radius:8px;">Cancelar</button>
            <button id="btn-confirmar-noticias" type="button" style="flex:1; padding:12px; background:#5b3824; border:none; color:white; border-radius:8px; font-weight:700;">Aplicar</button>
        </div>
    </div>
</div>
