<!-- components/popup/popup-ferramentas.html -->
<div id="popup-ferramentas-inline" class="popup-overlay" style="z-index: 9999;">
    <div class="popup-content" style="max-width: 550px; padding: 20px; width: 95%;">
        <div class="popup-header" style="padding: 0 0 15px 0; margin-bottom: 15px; border-bottom: 1px solid var(--border-color);">
            <h3 style="font-size: 14px;">Inserir Ferramentas</h3>
            <button type="button" data-fechar-ferramentas aria-label="Fechar ferramentas">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="popup-ferramentas-base-lista" class="tool-grid popup-ferramentas-base-lista" aria-label="Ferramentas base"></div>

        <div class="popup-ferramentas-separador" aria-hidden="true"></div>

        <div id="popup-ferramentas-loja-lista" class="tool-grid popup-ferramentas-loja-lista" aria-label="Ferramentas instaladas"></div>
    </div>
</div>
