<div id="popup-codex-biblia-overlay" class="popup-overlay" style="z-index: 10300;">
    <div class="popup-content bible-codex-popup-content" style="max-width: 560px; width: 95%;">
        <div class="popup-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <i class="fa-solid fa-book-journal-whills" style="color:#a78bfa;"></i>
                <div>
                    <h3 style="margin:0;">Codex da Bíblia</h3>
                    <p id="bible-codex-context" style="margin:3px 0 0; color:var(--text-muted); font-size:10px;"></p>
                </div>
            </div>
            <button id="btn-fechar-codex-biblia" type="button" aria-label="Fechar Codex da Bíblia">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div style="padding:15px 15px 0;">
            <div class="sub-tabs bible-codex-tabs" role="tablist" aria-label="Secções do Codex bíblico">
                <button class="bible-codex-tab active" type="button" role="tab" aria-selected="true" data-target="bible-codex-panel">
                    <i class="fa-solid fa-book-journal-whills"></i> Codex
                </button>
            </div>
        </div>

        <div id="bible-codex-panel" class="bible-codex-panel" role="tabpanel" style="padding:20px; max-height:65vh; overflow-y:auto; background:var(--bg-body);">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:15px;">
                <div>
                    <p style="margin:0; color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Mapeamentos bibliográficos</p>
                    <p style="margin:5px 0 0; color:var(--text-muted); font-size:11px;">Liga publicações, livros ou multimédia a este versículo.</p>
                </div>
                <button id="btn-adicionar-codex-biblia" type="button" class="btn-action-circle primary-icon" title="Adicionar ao Codex" aria-label="Adicionar ao Codex">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="bible-codex-list" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>
</div>
