<div id="popup-tempo-overlay" class="popup-overlay" style="z-index:10030;">
    <div class="popup-content" style="max-width:430px; width:94%; padding:25px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;">
            <h3 style="margin:0; color:#7dd3fc; font-size:17px; font-weight:800;">CONFIGURAR TEMPO</h3>
            <i class="fa-solid fa-cloud-sun" style="color:#7dd3fc; font-size:22px;"></i>
        </div>
        <p style="margin:0 0 18px; color:var(--text-muted); font-size:12px; line-height:1.5;">Escolhe a cidade para veres o estado do tempo atualizado uma vez por dia.</p>

        <label style="display:block; margin-bottom:8px; color:var(--text-muted); font-size:10px; font-weight:800; text-transform:uppercase;">Cidade</label>
        <div style="display:flex; gap:8px;">
            <input id="tempo-cidade" type="search" placeholder="Ex.: Lisboa" autocomplete="off" style="flex:1; min-width:0; padding:11px; background:var(--bg-body); border:1px solid var(--border-color); color:var(--text-main); border-radius:8px;">
            <button id="btn-pesquisar-tempo" type="button" title="Procurar cidade" aria-label="Procurar cidade" style="width:44px; border:0; border-radius:8px; background:#0ea5e9; color:#fff; cursor:pointer;"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div id="tempo-resultados" class="tempo-resultados" aria-live="polite"></div>
        <p id="tempo-config-erro" hidden style="margin:10px 0 0; color:#fca5a5; font-size:11px;"></p>

        <div style="margin-top:18px;">
            <span style="display:block; margin-bottom:9px; color:var(--text-muted); font-size:10px; font-weight:800; text-transform:uppercase;">Informações a mostrar</span>
            <div class="tempo-opcoes">
                <label><input id="tempo-opcao-temperatura" type="checkbox"> <span>Temperatura (°C)</span></label>
                <label><input id="tempo-opcao-condicao" type="checkbox"> <span>Condição do tempo</span></label>
                <label><input id="tempo-opcao-maxima" type="checkbox"> <span>Temperatura máxima</span></label>
                <label><input id="tempo-opcao-minima" type="checkbox"> <span>Temperatura mínima</span></label>
                <label><input id="tempo-opcao-vento" type="checkbox"> <span>Vento</span></label>
                <label><input id="tempo-opcao-sensacao" type="checkbox"> <span>Sensação térmica</span></label>
                <label><input id="tempo-opcao-humidade" type="checkbox"> <span>Humidade</span></label>
                <label><input id="tempo-opcao-chuva" type="checkbox"> <span>Probabilidade de chuva</span></label>
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:22px;">
            <button id="btn-cancelar-tempo" type="button" style="flex:1; padding:12px; background:transparent; border:1px solid var(--border-color); color:var(--text-muted); border-radius:8px;">Cancelar</button>
            <button id="btn-confirmar-tempo" type="button" style="flex:1; padding:12px; background:#0ea5e9; border:none; color:white; border-radius:8px; font-weight:700;">Aplicar</button>
        </div>
    </div>
</div>
