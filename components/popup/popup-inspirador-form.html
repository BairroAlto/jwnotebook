<div id="popup-inspirador-overlay" class="popup-overlay inspirador-popup-overlay" style="z-index:10030;">
    <div class="popup-content inspirador-popup popup-configuracao popup-configuracao--noticias" role="dialog" aria-modal="true" aria-labelledby="inspirador-popup-titulo">
        <div class="inspirador-popup__heading">
            <div>
                <p class="inspirador-popup__eyebrow"><i class="fa-solid fa-quote-left"></i> Loja de Ferramentas</p>
                <h3 id="inspirador-popup-titulo">CONFIGURAR INSPIRADOR</h3>
            </div>
            <i class="fa-solid fa-quote-left inspirador-popup__icon" aria-hidden="true"></i>
        </div>
        <p class="inspirador-popup__intro">Escolhe como a Wikiquote deve procurar e apresentar as tuas citações.</p>

        <label class="inspirador-popup__label" for="inspirador-modo">Procurar por</label>
        <select id="inspirador-modo" class="inspirador-popup__input">
            <option value="aleatorio">Aleatório</option>
            <option value="autor">Autor</option>
            <option value="tema">Tema</option>
        </select>

        <div data-inspirador-campo="autor" data-inspirador-campo-simples>
            <label class="inspirador-popup__label" for="inspirador-autor">Autor</label>
            <input id="inspirador-autor" class="inspirador-popup__input" type="text" placeholder="Ex.: Fernando Pessoa" autocomplete="off">
            <datalist id="inspirador-autores-list"></datalist>
        </div>
        <div data-inspirador-campo="tema" data-inspirador-campo-simples>
            <label class="inspirador-popup__label" for="inspirador-tema">Tema</label>
            <input id="inspirador-tema" class="inspirador-popup__input" type="text" placeholder="Ex.: coragem" autocomplete="off">
            <datalist id="inspirador-temas-list"></datalist>
        </div>

        <div id="inspirador-multiplos-campos" class="inspirador-popup__multiple" hidden>
            <label id="inspirador-multiplos-label" class="inspirador-popup__label">Autores</label>
            <div id="inspirador-multiplos-lista" class="inspirador-popup__multiple-lista"></div>
            <button id="btn-adicionar-inspirador-valor" class="inspirador-popup__add" type="button">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> Adicionar autor
            </button>
            <p class="inspirador-popup__hint">Escolhe vários autores ou temas para distribuir as citações.</p>
        </div>

        <div class="inspirador-popup__grid">
            <div>
                <label class="inspirador-popup__label" for="inspirador-idioma">Idioma das citações</label>
                <select id="inspirador-idioma" class="inspirador-popup__input">
                    <option value="pt">Português</option>
                    <option value="en">Inglês</option>
                    <option value="es">Espanhol</option>
                    <option value="fr">Francês</option>
                    <option value="it">Italiano</option>
                </select>
            </div>
            <div>
                <label class="inspirador-popup__label" for="inspirador-quantidade">Citações</label>
                <select id="inspirador-quantidade" class="inspirador-popup__input">
                    <option value="1">1 citação</option><option value="2">2 citações</option><option value="3">3 citações</option><option value="4">4 citações</option><option value="5">5 citações</option>
                </select>
            </div>
            <div>
                <label class="inspirador-popup__label" for="inspirador-variedade">Origem</label>
                <select id="inspirador-variedade" class="inspirador-popup__input">
                    <option value="mesmo">Mesmo autor/tema</option>
                    <option value="diferentes">Autores/temas diferentes</option>
                </select>
            </div>
        </div>

        <div class="inspirador-popup__grid">
            <div>
                <label class="inspirador-popup__label" for="inspirador-frequencia">Actualizar</label>
                <select id="inspirador-frequencia" class="inspirador-popup__input">
                    <option value="diaria">Uma nova por dia</option>
                    <option value="entrada">Sempre que entro nesta nota</option>
                </select>
            </div>
            <div>
                <label class="inspirador-popup__label" for="inspirador-vista">Apresentação</label>
                <select id="inspirador-vista" class="inspirador-popup__input">
                    <option value="lista">Lista, sem imagem</option>
                    <option value="grelha">Grelha, com imagem</option>
                </select>
            </div>
        </div>

        <div class="inspirador-popup__actions">
            <button id="btn-cancelar-inspirador" type="button">Cancelar</button>
            <button id="btn-confirmar-inspirador" type="button">Aplicar</button>
        </div>
    </div>
</div>
