<div class="calendar-manager-backdrop" id="calendar-manager" hidden>
    <section class="calendar-manager-panel" role="dialog" aria-modal="true" aria-labelledby="calendar-manager-title">
        <header class="calendar-manager-header">
            <div>
                <p class="eyebrow">Organização</p>
                <h2 id="calendar-manager-title">Os meus calendários</h2>
            </div>
            <button class="round-button" id="close-calendar-manager" type="button" aria-label="Fechar">×</button>
        </header>

        <div class="calendar-manager-tabs" role="tablist" aria-label="Gerir calendários">
            <button class="calendar-manager-tab active" type="button" role="tab" data-calendar-tab="create" aria-selected="true">Criar</button>
            <button class="calendar-manager-tab" type="button" role="tab" data-calendar-tab="edit" aria-selected="false">Editar</button>
        </div>

        <div class="calendar-manager-view" data-manager-view="create">
            <form id="calendar-create-form">
                <label class="calendar-manager-field">
                    <span>Nome do calendário</span>
                    <input id="calendar-name" type="text" maxlength="40" placeholder="Ex.: Família" required>
                </label>
                <fieldset class="calendar-color-picker">
                    <legend>Cor</legend>
                    <label><input type="radio" name="calendarColor" value="#f4b7a9|#a44f3b" checked><span style="--calendar-color:#f4b7a9">Coral</span></label>
                    <label><input type="radio" name="calendarColor" value="#cfc5ff|#594ca8"><span style="--calendar-color:#cfc5ff">Lavanda</span></label>
                    <label><input type="radio" name="calendarColor" value="#bfe5d5|#36745b"><span style="--calendar-color:#bfe5d5">Menta</span></label>
                    <label><input type="radio" name="calendarColor" value="#f5df9d|#8a6818"><span style="--calendar-color:#f5df9d">Dourado</span></label>
                    <label><input type="radio" name="calendarColor" value="#c9dff4|#39709e"><span style="--calendar-color:#c9dff4">Azul</span></label>
                </fieldset>
                <button class="primary-button calendar-manager-submit" type="submit">Criar calendário</button>
            </form>
        </div>

        <div class="calendar-manager-view" data-manager-view="edit" hidden>
            <div class="calendar-edit-list" id="calendar-edit-list"></div>
        </div>
        <p class="calendar-manager-status" id="calendar-manager-status" role="status" aria-live="polite"></p>
    </section>
</div>
